# .github/workflows/test.yml
name: Build and Test

on:
  push:
    branches: [ main ] # Triggers on push to main or develop branches
  pull_request:
    branches: [ main ] # Triggers on pull requests targeting main or develop
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Specifies the operating system for the job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Checks out your repository code

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specifies the Node.js version to use

      - name: Install dependencies
        run: npm ci # Installs project dependencies using npm ci (clean install)

      - name: Run tests
        run: npm test # Executes your project's test suite
